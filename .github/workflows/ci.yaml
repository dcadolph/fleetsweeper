name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fs
          POSTGRES_PASSWORD: fs
          POSTGRES_DB: fstest
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fs -d fstest"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      FLEETSWEEPER_PG_TEST_DSN: postgres://fs:fs@127.0.0.1:5432/fstest?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt needs to be run on:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      - run: go build ./...
      - run: go test -race -short ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v8
        with:
          version: v2.14.0

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # Fuzz by iteration count, not duration. A duration starts a deadline in the fuzz
      # coordinator, which can report its own expiry as "context deadline exceeded" and fail
      # a target that found nothing. A count sets no deadline, so that race cannot occur.
      - name: Fuzz smoke
        shell: bash
        run: |
          targets=$(grep -rE --include='*_test.go' -o '^func Fuzz[A-Za-z0-9_]*' . |
            sed -E 's|^(\./)?(.*)/[^/]+:func (Fuzz[A-Za-z0-9_]*)$|\2 \3|' | sort)
          if [ -z "$targets" ]; then
            echo "no fuzz targets found"
            exit 1
          fi
          while read -r dir target; do
            echo "::group::$target in $dir"
            go test -run='^$' -fuzz="^${target}\$" -fuzztime=50000x "./$dir/" || exit 1
            echo "::endgroup::"
          done <<< "$targets"

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      # The runner image ships Chrome, so the job needs no install step.
      - run: go test -tags=browser -count=1 ./internal/browser/

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - name: Install kind
        uses: helm/kind-action@v1
        with:
          install_only: true
          # The fleet harness pins the node image kind v0.33.0 ships with.
          version: v0.33.0
      # Pull the node images before the tests start, so the pull is not inside the test timeout.
      - name: Pull kind node images
        run: |
          docker pull kindest/node:v1.37.0@sha256:a1ed56cfb0e7b93589bdf97c8cd566405a265939e3620fc4f5de89adff580ae5
          docker pull kindest/node:v1.30.8
      - name: Integration tests
        env:
          FLEET_KIND_LOGS: ${{ runner.temp }}/kind-logs
        run: go test -tags=integration -timeout=20m -v ./internal/integration/
      - name: Upload kind logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: kind-logs
          path: ${{ runner.temp }}/kind-logs
          if-no-files-found: ignore
