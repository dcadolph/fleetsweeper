openapi: 3.0.3
info:
  title: Fleetsweeper API
  version: 0.10.0
  description: |
    HTTP API for the Fleetsweeper server. Read endpoints are unauthenticated
    when --insecure is set; mutating endpoints require a bearer token unless
    --insecure is in effect.
  license:
    name: MIT
    url: https://github.com/dcadolph/fleetsweeper/blob/main/LICENSE
  contact:
    name: Fleetsweeper project
    url: https://github.com/dcadolph/fleetsweeper

servers:
  - url: http://localhost:8080
    description: Local development server
  - url: https://{host}
    description: Operator-deployed server
    variables:
      host:
        default: fleet.internal

security:
  - bearerAuth: []
  - {}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Token configured via --auth-token. Required for POST/DELETE.

  parameters:
    Scan:
      in: query
      name: scan
      required: false
      description: >-
        Scan ID to report on. Empty means the latest scan. An unknown ID is a
        404.
      schema: {type: string}

  schemas:
    Severity:
      type: string
      enum: [critical, warning, info]

    ScanRecord:
      type: object
      required: [id, timestamp, clusters]
      properties:
        id: {type: string, example: "01HF8Z..."}
        timestamp: {type: string, format: date-time}
        clusters:
          type: array
          items: {type: string}
        scanners:
          type: array
          items: {type: string}

    FleetScore:
      type: object
      required: [score, grade, headline]
      properties:
        score: {type: integer, minimum: 0, maximum: 100}
        grade: {type: string, enum: [A, B, C, D, F]}
        headline: {type: string}
        drivers:
          type: array
          items:
            type: object
            required: [reason, impact]
            properties:
              reason: {type: string}
              impact: {type: integer}
        sample_size: {type: integer, description: Clusters that contributed scanner data.}
        dimensions: {type: integer, description: Scan dimensions with data from at least one cluster.}
        excluded_clusters: {type: integer, description: Scanned clusters with no usable data.}

    FleetScoreForecast:
      type: object
      required: [predicted, lower, upper, predicted_for, sufficient]
      properties:
        predicted: {type: integer, minimum: 0, maximum: 100}
        lower: {type: integer, minimum: 0, maximum: 100}
        upper: {type: integer, minimum: 0, maximum: 100}
        predicted_for: {type: string, format: date-time}
        slope_per_hour: {type: number}
        r_squared: {type: number, minimum: 0, maximum: 1}
        basis: {type: integer, minimum: 0}
        sufficient: {type: boolean}
        headline: {type: string}

    Remediation:
      type: object
      properties:
        command: {type: string}
        yaml: {type: string}
        runbook_url: {type: string, format: uri}

    Finding:
      type: object
      required: [title, severity, cluster, scanner, rule, fingerprint, acked]
      properties:
        title: {type: string}
        description: {type: string}
        severity: {$ref: "#/components/schemas/Severity"}
        cluster: {type: string, example: prod-us-east-1}
        scanner: {type: string, example: node-health}
        rule:
          type: string
          description: >-
            The check that produced the finding as scanner/slug. It names no
            cluster and no count, so the same check on two clusters shares a rule.
          example: node-health/not-ready
        fingerprint:
          type: string
          description: >-
            SHA-256 of cluster, scanner, and rule separated by NUL bytes. Ack a
            finding with POST /api/findings/{fingerprint}/ack.
        acked:
          type: boolean
          description: True when an active acknowledgement covers the finding.
        affected:
          type: array
          items: {type: string}
        remediation: {$ref: "#/components/schemas/Remediation"}
        norm: {$ref: "#/components/schemas/NormBasis"}

    NormBasis:
      type: object
      description: >-
        The norm a fleet-relative finding was measured against. Absent on
        absolute-rule findings. Which fields apply depends on kind.
      required: [scope, kind, median, mad, sample_size, threshold, value, z, limited_sample]
      properties:
        scope:
          type: string
          description: '"fleet" or the name of the cohort the norm was computed over.'
          example: fleet
        kind: {type: string, enum: [numeric, string, set]}
        median: {type: number, description: Population median of a numeric field.}
        mad: {type: number, description: Median absolute deviation of a numeric field.}
        mode: {type: string, description: Most common value of a string field.}
        mode_share: {type: number, description: Fraction of the population holding the mode.}
        consensus:
          type: array
          description: Set members present in at least the threshold share of clusters.
          items: {type: string}
        missing:
          type: array
          description: Consensus members this cluster lacks.
          items: {type: string}
        sample_size: {type: integer, description: Number of clusters in the population.}
        threshold:
          type: number
          description: >-
            Cutoff the detector applied: modified z-score for numeric, minimum
            mode share for string, minimum presence share for set membership.
        value: {type: string, description: This cluster's value for the field.}
        z: {type: number, description: Signed modified z-score for a numeric field.}
        limited_sample:
          type: boolean
          description: True when the population was too small for MAD.

    ClusterHealth:
      type: object
      required: [name, status]
      properties:
        name: {type: string}
        status: {type: string, enum: [healthy, busy, degraded, critical]}
        kubernetes_version: {type: string}
        node_count: {type: integer}
        healthy_nodes: {type: integer}
        avg_cpu: {type: number}
        avg_memory: {type: number}
        warning_events: {type: integer}
        namespace_count: {type: integer}
        finding_counts:
          type: object
          additionalProperties: {type: integer}

    OutlierResult:
      description: One deviating field on one cluster, with the norm it was measured against.
      allOf:
        - {$ref: "#/components/schemas/NormBasis"}
        - type: object
          required: [cluster, field, fleet_norm, scanner, severity]
          properties:
            cluster: {type: string}
            field: {type: string}
            fleet_norm: {type: string}
            deviation: {type: number}
            scanner: {type: string}
            severity: {$ref: "#/components/schemas/Severity"}

    CapacityAnalysis:
      type: object
      properties:
        cluster: {type: string}
        status: {type: string}
        cpu_utilization: {type: number}
        memory_utilization: {type: number}
        node_count: {type: integer}
        healthy_nodes: {type: integer}
        headroom_cpu: {type: number}
        headroom_memory: {type: number}
        has_memory_pressure: {type: boolean}
        recommendation: {type: string}

    Report:
      type: object
      required: [timestamp, clusters, summary, fleet_score]
      properties:
        timestamp: {type: string, format: date-time}
        clusters:
          type: array
          items: {type: string}
        summary:
          type: object
          properties:
            cluster_count: {type: integer}
            scanner_count: {type: integer}
            uniform_count: {type: integer}
            divergent_count: {type: integer}
            total_divergences: {type: integer}
            critical_count: {type: integer}
            warning_count: {type: integer}
        fleet_score: {$ref: "#/components/schemas/FleetScore"}
        findings:
          type: array
          items: {$ref: "#/components/schemas/Finding"}
        cluster_healths:
          type: array
          items: {$ref: "#/components/schemas/ClusterHealth"}
        outliers:
          type: array
          items: {$ref: "#/components/schemas/OutlierResult"}
        capacity:
          type: array
          items: {$ref: "#/components/schemas/CapacityAnalysis"}
        notes:
          type: array
          description: Analysis the report could not run, such as outlier detection on a fleet of fewer than 3 clusters.
          items: {type: string}
        distributions:
          type: array
          description: >-
            The population behind every field the fleet and cohort detectors
            evaluated, fleet scope first, most deviant first.
          items: {$ref: "#/components/schemas/Distribution"}
        deviation_mass:
          type: object
          description: >-
            Per cluster, the sum of capped |z| over its fleet-scope numeric
            values. Clusters at zero are left out.
          additionalProperties: {type: number}
        score_attribution: {$ref: "#/components/schemas/ScoreAttribution"}
        cohorts:
          type: array
          items: {$ref: "#/components/schemas/CohortSummary"}

    Distribution:
      type: object
      required: [scope, scanner, field, kind, values, median, mad, band, threshold, sample_size, mass]
      properties:
        scope: {type: string, description: '"fleet" or the cohort name.'}
        scanner: {type: string}
        field: {type: string}
        kind: {type: string, enum: [numeric, string, set]}
        values:
          type: array
          items:
            type: object
            required: [cluster]
            properties:
              cluster: {type: string}
              number: {type: number, description: Value of a numeric field.}
              text: {type: string, description: Value of a string field.}
              size: {type: integer, description: Members of a set field on this cluster.}
              missing:
                type: array
                description: Consensus members this cluster lacks.
                items: {type: string}
              z: {type: number, description: Signed modified z-score, zero when MAD is zero.}
              outlier: {type: boolean}
        median: {type: number}
        mad: {type: number}
        band: {type: number, description: "Distance from the median at which a value flags: threshold * MAD / 0.6745."}
        threshold: {type: number}
        mode: {type: string}
        mode_share: {type: number}
        consensus:
          type: array
          items: {type: string}
        sample_size: {type: integer}
        limited_sample: {type: boolean}
        mass: {type: number, description: Sum of |z| capped at 10 per value.}

    ScoreAttribution:
      type: object
      description: The cost ledger behind the fleet score. Applied costs sum to total.
      required: [terms, entries, total]
      properties:
        terms:
          type: array
          items:
            type: object
            required: [term, reason, count, raw, cost]
            properties:
              term:
                type: string
                enum: [critical-findings, warning-findings, info-findings, critical-clusters, degraded-clusters, version-skew, worst-node]
              reason: {type: string}
              count: {type: integer}
              raw: {type: number, description: Cost before the cap.}
              cap: {type: number, description: Most the term may cost. Absent when uncapped.}
              cost: {type: number, description: Points the term removed.}
        entries:
          type: array
          items:
            type: object
            required: [term, raw, cost]
            properties:
              term: {type: string}
              rule: {type: string}
              cluster: {type: string}
              raw: {type: number}
              cost: {type: number}
        total: {type: number}
        by_cluster:
          type: object
          additionalProperties: {type: number}
        by_rule:
          type: object
          additionalProperties: {type: number}

    CohortSummary:
      type: object
      required: [name, source, clusters]
      properties:
        name: {type: string}
        source: {type: string, enum: [tagged, auto, fleet]}
        clusters:
          type: array
          items: {type: string}
        outliers:
          type: array
          items: {$ref: "#/components/schemas/OutlierResult"}

    ScannerInfo:
      type: object
      required: [id, label, description, category]
      properties:
        id: {type: string, example: node-health}
        label: {type: string, example: Node Health}
        description: {type: string}
        category: {type: string}

    APIKey:
      type: object
      required: [id, name, role, cluster_scope, created_at]
      properties:
        id: {type: string}
        name: {type: string}
        role: {type: string, enum: [admin, operator, viewer]}
        cluster_scope:
          type: array
          description: Cluster names or group:<name> entries. ["*"] is unrestricted.
          items: {type: string}
        created_at: {type: string, format: date-time}
        expires_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
        created_by: {type: string}

    AuditEntry:
      type: object
      required: [id, timestamp, method, path, status, duration_ms]
      properties:
        id: {type: string}
        timestamp: {type: string, format: date-time}
        actor_id: {type: string}
        actor_name: {type: string}
        actor_role: {type: string}
        method: {type: string}
        path: {type: string}
        status: {type: integer}
        remote_addr: {type: string}
        user_agent: {type: string}
        duration_ms: {type: integer}
        error: {type: string}

    CohortMap:
      type: object
      required: [points, leaf_order, stress]
      properties:
        points:
          type: array
          items:
            type: object
            required: [cluster, cohort, x, y]
            properties:
              cluster: {type: string}
              cohort: {type: string}
              x: {type: number}
              y: {type: number}
              peers:
                type: array
                items: {$ref: "#/components/schemas/Peer"}
        leaf_order:
          type: array
          description: Every cluster, each cohort one contiguous run, in dendrogram order.
          items: {type: string}
        stress:
          type: number
          description: Kruskal stress-1 of the 2D layout. 0 is a perfect fit.

    Peer:
      type: object
      required: [cluster, distance]
      properties:
        cluster: {type: string}
        distance: {type: number, description: Euclidean distance between cohort feature vectors.}

    DriftLedger:
      type: object
      required: [scans, clusters]
      properties:
        scans:
          type: array
          description: Scan IDs the ledger spans, oldest first.
          items: {type: string}
        clusters:
          type: array
          description: >-
            Clusters whose own value changed or whose outlier flag flipped,
            largest change in deviation mass first.
          items:
            type: object
            required: [cluster, mass, mass_before, mass_after, mass_delta]
            properties:
              cluster: {type: string}
              mass:
                type: array
                items: {type: number}
              mass_before: {type: number}
              mass_after: {type: number}
              mass_delta: {type: number}
              fields:
                type: array
                items:
                  type: object
                  properties:
                    scanner: {type: string}
                    field: {type: string}
                    z_before: {type: number}
                    z_after: {type: number}
                    before: {type: string}
                    after: {type: string}
              gained:
                type: array
                items: {$ref: "#/components/schemas/FlagChange"}
              lost:
                type: array
                items: {$ref: "#/components/schemas/FlagChange"}

    FlagChange:
      type: object
      required: [scanner, field, scan]
      properties:
        scanner: {type: string}
        field: {type: string}
        scan: {type: string, description: Scan where the flag last flipped.}

    TagMap:
      type: object
      description: Tag key to value.
      additionalProperties: {type: string}

    CostAnalysis:
      type: object
      required: [currency, total_fleet_usd, total_drift_usd]
      properties:
        currency: {type: string, example: USD}
        period: {type: string, example: "2026-05"}
        total_fleet_usd: {type: number}
        total_drift_usd: {type: number}
        missing_cost:
          type: array
          items: {type: string}
        by_cluster:
          type: array
          items:
            type: object
            required: [cluster, score, cost_usd, drift_usd]
            properties:
              cluster: {type: string}
              score: {type: integer}
              cost_usd: {type: number}
              drift_usd: {type: number}
              period: {type: string}

    IntegrationStatus:
      type: object
      required: [name, status]
      properties:
        name: {type: string}
        status: {type: string, enum: [configured, off, demo]}
        hint: {type: string}

    Group:
      type: object
      required: [name]
      properties:
        name: {type: string}
        clusters:
          type: array
          items: {type: string}

    AckRequest:
      type: object
      properties:
        cluster: {type: string}
        scanner: {type: string}
        title: {type: string}
        ack_by: {type: string}
        reason: {type: string}
        snooze_until: {type: string, format: date-time}

    AckRecord:
      type: object
      required: [fingerprint, created_at]
      properties:
        fingerprint: {type: string}
        cluster: {type: string}
        scanner: {type: string}
        title: {type: string}
        ack_by: {type: string}
        reason: {type: string}
        snooze_until: {type: string, format: date-time}
        created_at: {type: string, format: date-time}

    AlertRecord:
      type: object
      required: [fingerprint, cluster, status, alertname, received_at, labels, annotations]
      properties:
        fingerprint:
          type: string
          description: AlertManager fingerprint for Prom alerts; SHA-256 of (cluster, rule, pod, container) for Falco events.
        cluster: {type: string}
        status: {type: string, enum: [firing, resolved]}
        alertname: {type: string}
        severity: {type: string}
        summary: {type: string}
        starts_at: {type: string, format: date-time}
        ends_at: {type: string, format: date-time}
        received_at: {type: string, format: date-time}
        labels:
          type: object
          additionalProperties: {type: string}
        annotations:
          type: object
          additionalProperties: {type: string}
        generator_url: {type: string, format: uri}

    Error:
      type: object
      required: [error, code]
      properties:
        error: {type: string}
        code: {type: integer}

paths:
  /healthz:
    get:
      summary: Liveness probe
      security: []
      responses:
        "200": {description: Process is alive}

  /readyz:
    get:
      summary: Readiness probe (pings the store)
      security: []
      responses:
        "200": {description: Store reachable}
        "503": {description: Store unavailable}

  /api/scans:
    get:
      summary: List recent scans
      parameters:
        - in: query
          name: limit
          schema: {type: integer, default: 50}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ScanRecord"}
    post:
      summary: Trigger a new scan
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contexts:
                  type: array
                  items: {type: string}
                all_contexts: {type: boolean}
                group: {type: string}
      responses:
        "202":
          description: Scan accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  scan_id: {type: string}
                  status: {type: string}
        "429":
          description: A scan is already in progress

  /api/scans/{id}:
    get:
      summary: Get a scan record by ID
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ScanRecord"}
        "404": {description: Scan not found}

  /api/scans/{id}/report:
    get:
      summary: Get the full computed report for a scan
      parameters:
        - in: path
          name: id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Report"}

  /api/clusters:
    get:
      summary: List all known clusters
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: {type: string}
                    first_seen: {type: string, format: date-time}
                    last_seen: {type: string, format: date-time}

  /api/clusters/{name}/detail:
    get:
      summary: Full scanner data, health, and findings for a cluster
      parameters:
        - in: path
          name: name
          required: true
          schema: {type: string}
        - {$ref: "#/components/parameters/Scan"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cluster: {type: string}
                  scan_id: {type: string}
                  scan_time: {type: string, format: date-time}
                  health: {$ref: "#/components/schemas/ClusterHealth"}
                  findings:
                    type: array
                    items: {$ref: "#/components/schemas/Finding"}
                  scanner_data:
                    type: object
                    additionalProperties: true
                  peers:
                    type: array
                    description: The five nearest clusters on the cohort map.
                    items: {$ref: "#/components/schemas/Peer"}
                  distributions:
                    type: array
                    description: Every distribution, in any scope, that flags this cluster.
                    items: {$ref: "#/components/schemas/Distribution"}

  /api/groups:
    get:
      summary: List groups
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/Group"}
    post:
      summary: Create a group
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: {type: string}
                clusters:
                  type: array
                  items: {type: string}
      responses:
        "201": {description: Created}

  /api/groups/{name}:
    delete:
      summary: Delete a group
      parameters:
        - in: path
          name: name
          required: true
          schema: {type: string}
      responses:
        "204": {description: Deleted}

  /api/trends:
    get:
      summary: Fleet-wide trend analysis
      parameters:
        - in: query
          name: scans
          schema: {type: integer, default: 10}
      responses:
        "200": {description: OK}

  /api/trends/{cluster}:
    get:
      summary: Per-cluster trend analysis
      parameters:
        - in: path
          name: cluster
          required: true
          schema: {type: string}
      responses:
        "200": {description: OK}

  /api/outliers:
    get:
      summary: Outlier detection on the latest scan
      parameters:
        - in: query
          name: threshold
          schema: {type: number, default: 3.5}
        - {$ref: "#/components/parameters/Scan"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  scan_id: {type: string}
                  outliers:
                    type: array
                    items: {$ref: "#/components/schemas/OutlierResult"}
                  findings:
                    type: array
                    items: {$ref: "#/components/schemas/Finding"}

  /api/capacity:
    get:
      summary: Capacity correlator output
      parameters:
        - {$ref: "#/components/parameters/Scan"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  scan_id: {type: string}
                  capacity:
                    type: array
                    items: {$ref: "#/components/schemas/CapacityAnalysis"}

  /api/forecast/fleet-score:
    get:
      summary: Forecast the next Fleet Score from history
      parameters:
        - in: query
          name: scans
          schema: {type: integer, default: 10}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  history:
                    type: array
                    items:
                      type: object
                      properties:
                        scan_id: {type: string}
                        timestamp: {type: string, format: date-time}
                        score: {type: integer}
                  forecast: {$ref: "#/components/schemas/FleetScoreForecast"}

  /api/forecast/clusters:
    get:
      summary: Per-cluster Fleet Score forecasts ranked by projected delta
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  forecasts:
                    type: array
                    items:
                      type: object
                      properties:
                        cluster: {type: string}
                        current_score: {type: integer}
                        forecast: {$ref: "#/components/schemas/FleetScoreForecast"}

  /api/cost:
    get:
      summary: Cost correlation (requires --cost-csv)
      parameters:
        - {$ref: "#/components/parameters/Scan"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/CostAnalysis"}

  /api/integrations:
    get:
      summary: Which integrations are configured
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/IntegrationStatus"}

  /api/acks:
    get:
      summary: List active finding acknowledgements
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AckRecord"}

  /api/findings/timeline:
    get:
      summary: Fleet findings over recent scans for drift replay
      parameters:
        - in: query
          name: scans
          schema: {type: integer, default: 24, maximum: 60}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  scans: {type: integer}
                  points:
                    type: array
                    items:
                      type: object
                      properties:
                        scan_id: {type: string}
                        timestamp: {type: string, format: date-time}
                        total: {type: integer}
                        critical: {type: integer}
                        warning: {type: integer}
                        info: {type: integer}
                        findings:
                          type: array
                          items:
                            type: object
                            properties:
                              fingerprint: {type: string}
                              title: {type: string}
                              severity: {type: string}
                              cluster: {type: string}
                              scanner: {type: string}

  /api/findings/persistence:
    get:
      summary: Recurrence-based persistence class per finding across recent scans
      parameters:
        - in: query
          name: scans
          schema: {type: integer, default: 24, maximum: 60}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  scans: {type: integer}
                  chronic: {type: integer}
                  intermittent: {type: integer}
                  transient: {type: integer}
                  findings:
                    type: array
                    items:
                      type: object
                      properties:
                        fingerprint: {type: string}
                        cluster: {type: string}
                        scanner: {type: string}
                        title: {type: string}
                        severity: {type: string}
                        present: {type: integer}
                        total: {type: integer}
                        fraction: {type: number}
                        streak: {type: integer}
                        class: {type: string, enum: [chronic, intermittent, transient]}
                        acked: {type: boolean}

  /api/findings/{fingerprint}/ack:
    post:
      summary: Record a finding acknowledgement
      parameters:
        - in: path
          name: fingerprint
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AckRequest"}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AckRecord"}
    delete:
      summary: Remove a finding acknowledgement
      parameters:
        - in: path
          name: fingerprint
          required: true
          schema: {type: string}
      responses:
        "204": {description: Deleted}

  /api/alerts:
    get:
      summary: List inbound alerts (AlertManager + Falco)
      parameters:
        - in: query
          name: cluster
          schema: {type: string}
          description: Restrict to one cluster.
        - in: query
          name: status
          schema: {type: string, enum: [firing, resolved]}
        - in: query
          name: severity
          schema: {type: string}
          description: Filter by severity label value.
        - in: query
          name: since
          schema: {type: string, format: date-time}
          description: Only alerts received after this RFC3339 timestamp.
        - in: query
          name: limit
          schema: {type: integer, default: 200, minimum: 1, maximum: 1000}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  alerts:
                    type: array
                    items: {$ref: "#/components/schemas/AlertRecord"}
                  count: {type: integer}

  /api/alerts/{fingerprint}/ack:
    post:
      summary: Acknowledge an inbound alert
      parameters:
        - in: path
          name: fingerprint
          required: true
          schema: {type: string}
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                ack_by: {type: string}
                reason: {type: string}
                snooze_until:
                  type: string
                  format: date-time
                  description: Optional RFC3339 expiry; omit for a permanent ack.
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema: {$ref: "#/components/schemas/AckRecord"}
        "404": {description: Alert fingerprint not found}

  /api/webhooks/alertmanager:
    post:
      summary: Receive a Prometheus AlertManager v4 webhook payload
      description: |
        Authenticated via the shared --webhook-secret as a bearer token.
        Each alert is persisted in the alerts table, keyed by AlertManager
        fingerprint (upsert on status change), and emitted on the SSE bus
        as alert.received.
      responses:
        "202": {description: Accepted}
        "401": {description: Invalid bearer token}
        "404": {description: Webhook receiver disabled (no secret configured)}

  /api/webhooks/falco:
    post:
      summary: Receive a Falco HTTP_OUTPUT event (or falcosidekick forward)
      description: |
        Authenticated via the shared --webhook-secret as a bearer token.
        Cluster identity comes from the event labels (`cluster`/
        `k8s_cluster_name`) or the optional X-Fleetsweeper-Cluster
        request header.
      responses:
        "202": {description: Accepted}
        "401": {description: Invalid bearer token}
        "404": {description: Webhook receiver disabled (no secret configured)}

  /api/clusters/{name}/timeline:
    get:
      summary: Interleaved chronological view of one cluster
      description: |
        Returns recent scans, ingested alerts, and acks for the requested
        cluster, newest first. Scoped by the calling actor.
      parameters:
        - in: path
          name: name
          required: true
          schema: {type: string}
        - in: query
          name: limit
          schema: {type: integer, default: 100, minimum: 1, maximum: 500}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  cluster: {type: string}
                  count: {type: integer}
                  entries:
                    type: array
                    items:
                      type: object
                      properties:
                        kind: {type: string, enum: [scan, alert, ack]}
                        at: {type: string, format: date-time}
                        severity: {type: string}
                        title: {type: string}
                        detail: {type: string}
                        ref: {type: string}

  /api/geo:
    get:
      summary: Cluster placements and health for the latest scan
      parameters:
        - {$ref: "#/components/parameters/Scan"}
      responses:
        "200": {description: OK}

  /api/locations:
    get:
      summary: List manual location overrides
      responses:
        "200": {description: OK}

  /api/locations/{cluster}:
    put:
      summary: Upsert a manual location override
      parameters:
        - in: path
          name: cluster
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                lat: {type: number}
                lng: {type: number}
                site: {type: string}
                notes: {type: string}
      responses:
        "200": {description: OK}
    delete:
      summary: Remove a manual location override
      parameters:
        - in: path
          name: cluster
          required: true
          schema: {type: string}
      responses:
        "204": {description: Deleted}

  /api/contexts:
    get:
      summary: Kubeconfig contexts available to the server
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name: {type: string}
                    scanned: {type: boolean}

  /openapi.yaml:
    get:
      summary: This specification
      security: []
      responses:
        "200":
          description: OK
          content:
            application/yaml:
              schema: {type: string}

  /oidc/login:
    get:
      summary: Start an OIDC sign-in
      description: Redirects to the identity provider. 404 when OIDC is not configured.
      security: []
      responses:
        "302": {description: Redirect to the identity provider}
        "404": {description: OIDC is not configured}

  /oidc/callback:
    get:
      summary: Finish an OIDC sign-in
      description: >-
        The identity provider redirects here with a code and state. On success
        a session cookie is set and the browser is sent to the dashboard.
      security: []
      parameters:
        - {in: query, name: code, schema: {type: string}}
        - {in: query, name: state, schema: {type: string}}
      responses:
        "302": {description: Signed in, redirect to the dashboard}
        "400": {description: Missing or mismatched state, missing code, or undecodable claims}
        "401": {description: Token exchange failed or the id_token is missing or invalid}
        "404": {description: OIDC is not configured}

  /oidc/logout:
    get:
      summary: End the OIDC session
      security: []
      responses:
        "302": {description: Session cleared, redirect to the dashboard}

  /api/scanners:
    get:
      summary: Every scanner with its label, description, and category
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/ScannerInfo"}

  /api/scans/{id}/seal:
    get:
      summary: HMAC seal of a scan's export bundle
      description: >-
        Rebuilds the bundle a default `fleetsweeper export --seal-key` writes
        for the scan and returns the signature of its MANIFEST. The same scan
        returns the same signature on every call. 404 when the server runs
        without --seal-key.
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [scan_id, algorithm, source, signature, manifest]
                properties:
                  scan_id: {type: string}
                  algorithm: {type: string, enum: [HMAC-SHA256]}
                  source: {type: string, enum: [MANIFEST]}
                  signature: {type: string, example: "sha256=3f1c..."}
                  manifest: {type: string, description: "One \"<sha256>  <path>\" line per bundle file."}
        "404": {description: Sealing disabled or scan not found}

  /api/cohorts:
    get:
      summary: Cohort partition of the latest scan with within-cohort outliers
      parameters:
        - in: query
          name: threshold
          schema: {type: number, default: 3.5}
        - {$ref: "#/components/parameters/Scan"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  scan_id: {type: string}
                  cohorts:
                    type: array
                    items: {$ref: "#/components/schemas/CohortSummary"}
        "404": {description: No scans, or the named scan does not exist}

  /api/tags:
    get:
      summary: Every cluster's tags, limited to the caller's cluster scope
      responses:
        "200":
          description: Cluster name to its tags
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {$ref: "#/components/schemas/TagMap"}

  /api/clusters/{name}/tags:
    get:
      summary: One cluster's tags
      parameters:
        - {in: path, name: name, required: true, schema: {type: string}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TagMap"}
        "403": {description: Cluster outside the caller's scope}

  /api/clusters/{name}/tags/{key}:
    put:
      summary: Set one tag on a cluster
      parameters:
        - {in: path, name: name, required: true, schema: {type: string}}
        - {in: path, name: key, required: true, schema: {type: string}}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                value: {type: string}
      responses:
        "200":
          description: The tag as set
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TagMap"}
        "403": {description: Cluster outside the caller's scope}
    delete:
      summary: Remove one tag from a cluster
      parameters:
        - {in: path, name: name, required: true, schema: {type: string}}
        - {in: path, name: key, required: true, schema: {type: string}}
      responses:
        "204": {description: Removed, or was not set}
        "403": {description: Cluster outside the caller's scope}

  /api/events:
    get:
      summary: Server-sent event stream of scan and alert events
      description: >-
        A text/event-stream that stays open. Each event names its type, for
        example scan.complete, and carries a JSON payload.
      responses:
        "200":
          description: Event stream
          content:
            text/event-stream:
              schema: {type: string}

  /api/webhooks/scan-trigger:
    post:
      summary: Start a scan from a signed inbound webhook
      description: >-
        The body is signed with HMAC-SHA256 under the inbound webhook secret and
        the signature sent as X-Fleetsweeper-Signature: sha256=<hex>. 404 when
        no inbound secret is configured.
      security: []
      parameters:
        - in: header
          name: X-Fleetsweeper-Signature
          required: true
          schema: {type: string, example: "sha256=..."}
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                contexts:
                  type: array
                  items: {type: string}
                all_contexts: {type: boolean}
                group: {type: string}
      responses:
        "202":
          description: Scan accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  scan_id: {type: string}
                  status: {type: string}
        "400": {description: Unreadable body, unknown group, or no contexts}
        "401": {description: Missing or invalid signature}
        "404": {description: Inbound webhook disabled}
        "429": {description: A scan is already in progress}

  /api/admin/keys:
    get:
      summary: List API keys (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/APIKey"}
    post:
      summary: Create an API key (admin)
      description: The raw token is returned once and cannot be read again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, role]
              properties:
                name: {type: string}
                role: {type: string, enum: [admin, operator, viewer]}
                cluster_scope:
                  type: array
                  description: Empty means ["*"].
                  items: {type: string}
                ttl: {type: string, description: Go duration such as 720h. Empty means no expiry.}
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                type: object
                required: [key, token]
                properties:
                  key: {$ref: "#/components/schemas/APIKey"}
                  token: {type: string}
        "400": {description: Missing name, unknown role, or bad ttl}

  /api/admin/keys/{id}:
    delete:
      summary: Revoke an API key (admin)
      parameters:
        - {in: path, name: id, required: true, schema: {type: string}}
      responses:
        "204": {description: Revoked}
        "404": {description: Key not found}

  /api/admin/audit:
    get:
      summary: Query the audit log of mutating requests (admin)
      parameters:
        - {in: query, name: limit, schema: {type: integer, maximum: 1000}}
        - {in: query, name: since, schema: {type: string, format: date-time}}
        - {in: query, name: actor, schema: {type: string}}
        - {in: query, name: min_status, schema: {type: integer}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items: {$ref: "#/components/schemas/AuditEntry"}

  /api/admin/whoami:
    get:
      summary: The calling actor's identity (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, role, cluster_scope]
                properties:
                  id: {type: string, description: Key ID, bootstrap, or anonymous.}
                  name: {type: string}
                  role: {type: string}
                  cluster_scope:
                    type: array
                    items: {type: string}

  /api/admin/system:
    get:
      summary: Process snapshot for the admin panel (admin)
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  version: {type: string}
                  commit: {type: string}
                  build_date: {type: string}
                  go_version: {type: string}
                  uptime: {type: string}
                  started_at: {type: string, format: date-time}
                  features:
                    type: object
                    additionalProperties: {type: boolean}
                  counters:
                    type: object
                    properties:
                      scans_ok: {type: integer}
                      scans_err: {type: integer}
                      last_scan_duration_ms: {type: integer}
                  storage:
                    type: object
                    properties:
                      driver: {type: string}
                      healthy: {type: boolean}

  /api/distributions:
    get:
      summary: The distributions behind the fleet norm for one scan
      parameters:
        - {$ref: "#/components/parameters/Scan"}
        - in: query
          name: scope
          description: '"fleet" (default), a cohort name, or "*" for every scope.'
          schema: {type: string}
        - {in: query, name: scanner, schema: {type: string}}
        - {in: query, name: field, schema: {type: string}}
      responses:
        "200":
          description: Matching distributions, most deviant first
          content:
            application/json:
              schema:
                type: object
                required: [scan_id, distributions]
                properties:
                  scan_id: {type: string}
                  distributions:
                    type: array
                    items: {$ref: "#/components/schemas/Distribution"}
        "404": {description: No scans, or the named scan does not exist}

  /api/distributions/history:
    get:
      summary: One field's distribution across the most recent scans
      parameters:
        - {in: query, name: scanner, required: true, schema: {type: string}}
        - {in: query, name: field, required: true, schema: {type: string}}
        - {in: query, name: scope, schema: {type: string, default: fleet}}
        - {in: query, name: scans, schema: {type: integer, default: 24, maximum: 50}}
      responses:
        "200":
          description: One point per scan, oldest first
          content:
            application/json:
              schema:
                type: object
                required: [scanner, field, scope, points]
                properties:
                  scanner: {type: string}
                  field: {type: string}
                  scope: {type: string}
                  points:
                    type: array
                    items:
                      type: object
                      required: [scan_id, timestamp]
                      properties:
                        scan_id: {type: string}
                        timestamp: {type: string, format: date-time}
                        distribution:
                          nullable: true
                          allOf:
                            - {$ref: "#/components/schemas/Distribution"}
        "400": {description: scanner or field missing}

  /api/score/attribution:
    get:
      summary: The fleet score of one scan and the ledger of what it cost
      parameters:
        - {$ref: "#/components/parameters/Scan"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [scan_id, score, attribution]
                properties:
                  scan_id: {type: string}
                  score: {$ref: "#/components/schemas/FleetScore"}
                  attribution: {$ref: "#/components/schemas/ScoreAttribution"}
        "404": {description: No scans, or the named scan does not exist}

  /api/drift:
    get:
      summary: Which clusters drifted against the fleet norm over a window of scans
      description: >-
        Either the most recent scans (scans, default 10) or the scans between
        since and until, at most 50 of the newest.
      parameters:
        - {in: query, name: scans, schema: {type: integer, default: 10, maximum: 50}}
        - {in: query, name: since, schema: {type: string, format: date-time}}
        - {in: query, name: until, schema: {type: string, format: date-time}}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: {$ref: "#/components/schemas/DriftLedger"}
        "400": {description: since or until is not RFC 3339}

  /api/cohorts/map:
    get:
      summary: Two-dimensional cohort map of one scan with nearest peers
      parameters:
        - {$ref: "#/components/parameters/Scan"}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [scan_id, map]
                properties:
                  scan_id: {type: string}
                  map: {$ref: "#/components/schemas/CohortMap"}
        "404": {description: No scans, or the named scan does not exist}

  /api/whatif:
    post:
      summary: Project the score and norm if one cluster's field were fixed
      description: >-
        Rebuilds the scan from a patched copy of its results and writes
        nothing. A read-scope key may call it; it counts against the write rate
        limit. A cluster outside the caller's scope is a 403.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [cluster, scanner, field]
              properties:
                cluster: {type: string}
                scanner: {type: string}
                field: {type: string}
                fix: {type: string, enum: [median, mode, consensus, remove]}
                scope: {type: string, default: fleet}
                scan: {type: string, description: Scan to project from. Empty means the latest.}
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [scan_id, outcome]
                properties:
                  scan_id: {type: string}
                  outcome:
                    type: object
                    required: [fix, score_before, score_after, before, median_shift, mad_shift]
                    properties:
                      fix:
                        type: object
                        properties:
                          cluster: {type: string}
                          scanner: {type: string}
                          field: {type: string}
                          kind: {type: string}
                          scope: {type: string}
                      score_before: {type: integer}
                      score_after: {type: integer}
                      before: {$ref: "#/components/schemas/Distribution"}
                      after: {$ref: "#/components/schemas/Distribution"}
                      median_shift: {type: number}
                      mad_shift: {type: number}
                      new_outliers:
                        type: array
                        items: {type: string}
                      cleared_outliers:
                        type: array
                        items: {type: string}
        "400": {description: Missing or unknown fields in the body}
        "403": {description: Cluster outside the caller's scope}
        "404": {description: No scans, or the named scan does not exist}
        "422": {description: The fix does not apply to the field or cluster}
        "429": {description: Rate limited}
