# One control-plane node with no CoreDNS. The fleet tests only talk to the
# API server, so the DNS addon costs memory and adds nothing. kube-proxy
# stays: kind's "none" proxy mode leaves it crash-looping, which the
# scanners rightly report as a bad deploy on every cluster. SystemVerification
# is non-fatal because CI runner kernels ship without the configs module.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        skipPhases:
          - addon/coredns
        nodeRegistration:
          ignorePreflightErrors:
            - SystemVerification
