<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <!-- Full-width brand header. Blue field edge to edge, the radar mark, wordmark
       and tagline beside it, all centered. The mark is inline geometry because
       GitHub blocks external refs inside an img-loaded SVG. A slow glow pulse
       rings the mark; reduced motion stills it. -->
  <defs>
    <radialGradient id="bf" cx="50%" cy="46%" r="72%">
      <stop offset="0%" stop-color="#164573"/>
      <stop offset="55%" stop-color="#0e2a48"/>
      <stop offset="100%" stop-color="#091626"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <style>
      @keyframes ringpulse { 0%,100% { opacity: 0.30 } 50% { opacity: 0.60 } }
      .ring { animation: ringpulse 3.2s ease-in-out infinite }
      @media (prefers-reduced-motion: reduce) { * { animation: none !important } }
    </style>
  </defs>

  <rect x="0" y="0" width="1200" height="200" fill="url(#bf)"/>
  <circle cx="90" cy="60" r="5" fill="#58a6ff" opacity="0.12"/><circle cx="150" cy="130" r="4" fill="#58a6ff" opacity="0.09"/><circle cx="70" cy="150" r="3" fill="#3fb950" opacity="0.09"/><circle cx="210" cy="70" r="4" fill="#58a6ff" opacity="0.08"/><circle cx="250" cy="145" r="3" fill="#58a6ff" opacity="0.1"/><circle cx="180" cy="45" r="3" fill="#3fb950" opacity="0.07"/><circle cx="1110" cy="60" r="5" fill="#58a6ff" opacity="0.12"/><circle cx="1050" cy="135" r="4" fill="#58a6ff" opacity="0.09"/><circle cx="1130" cy="150" r="3" fill="#3fb950" opacity="0.09"/><circle cx="990" cy="70" r="4" fill="#58a6ff" opacity="0.08"/><circle cx="950" cy="145" r="3" fill="#58a6ff" opacity="0.1"/><circle cx="1020" cy="45" r="3" fill="#3fb950" opacity="0.07"/>

  <!-- Logo glow ring -->
  <circle class="ring" cx="421.0" cy="100" r="80" fill="none" stroke="#58a6ff" stroke-width="4" opacity="0.45" filter="url(#soft)"/>
  <g transform="translate(334.87 13.87) scale(0.16822)">
    <defs>
    <clipPath id="fs-stray" clipPathUnits="userSpaceOnUse">
    <path clip-rule="evenodd"
    d="M 0 0 H 1024 V 1024 H 0 Z M 726 635.215390309 L 782.97114317 668.107695155 L 782.97114317 733.892304845 L 726 766.784609691 L 669.02885683 733.892304845 L 669.02885683 668.107695155 Z"/>
    </clipPath>
    </defs>
    <circle id="ring" cx="512" cy="512" r="406"
    fill="none" stroke="#58a6ff" stroke-width="44"/>
    <g id="honeycomb" fill="#58a6ff">
    <polygon points="372,334 410.97114317,356.5 410.97114317,401.5 372,424 333.02885683,401.5 333.02885683,356.5"/>
    <polygon points="275,334 313.97114317,356.5 313.97114317,401.5 275,424 236.02885683,401.5 236.02885683,356.5"/>
    <polygon points="323.5,249.995535833 362.47114317,272.495535833 362.47114317,317.495535833 323.5,339.995535833 284.52885683,317.495535833 284.52885683,272.495535833"/>
    <polygon points="420.5,249.995535833 459.47114317,272.495535833 459.47114317,317.495535833 420.5,339.995535833 381.52885683,317.495535833 381.52885683,272.495535833"/>
    <polygon points="469,334 507.97114317,356.5 507.97114317,401.5 469,424 430.02885683,401.5 430.02885683,356.5"/>
    <polygon points="420.5,418.004464167 459.47114317,440.504464167 459.47114317,485.504464167 420.5,508.004464167 381.52885683,485.504464167 381.52885683,440.504464167"/>
    <polygon points="323.5,418.004464167 362.47114317,440.504464167 362.47114317,485.504464167 323.5,508.004464167 284.52885683,485.504464167 284.52885683,440.504464167"/>
    </g>
    <g id="sweep" fill="#58a6ff" clip-path="url(#fs-stray)">
    <path fill-opacity="0.15" d="M 512 512 L 854.5843435 671.749702938 A 378 378 0 0 1 826.29551345 722.005548081 Z"/>
    <path fill-opacity="0.4" d="M 512 512 L 826.29551345 722.005548081 A 378 378 0 0 1 790.690833314 767.373098479 Z"/>
    <path fill-opacity="0.7" d="M 512 512 L 790.690833314 767.373098479 A 378 378 0 0 1 748.599072486 806.796334609 Z"/>
    <path fill-opacity="1" d="M 512 512 L 748.599072486 806.796334609 A 378 378 0 0 1 701 839.357602631 Z"/>
    </g>
    <circle id="pivot" cx="512" cy="512" r="18" fill="#58a6ff"/>
    <polygon id="stray" fill="#3fb950"
    points="726,656 764.97114317,678.5 764.97114317,723.5 726,746 687.02885683,723.5 687.02885683,678.5"/>
  </g>

  <!-- Wordmark -->
  <text x="521.0" y="95" fill="#f0f6fc" font-size="50" font-weight="700" letter-spacing="-0.5">Fleetsweeper</text>
  <text x="523.0" y="126" fill="#8b949e" font-size="18">the fleet is the policy</text>

  <line x1="0" y1="199.5" x2="1200" y2="199.5" stroke="#16324f"/>
</svg>
